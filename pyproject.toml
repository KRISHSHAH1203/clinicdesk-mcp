[project]
name = "clinicdesk-mcp"
version = "0.1.0"
description = "MCP server that lets AI agents book clinic appointments safely: RBAC, tenant isolation, idempotent writes, audit log."
requires-python = ">=3.10"
dependencies = ["mcp>=1.20,<2", "pydantic>=2"]

[project.optional-dependencies]
dev = ["pytest", "anyio", "pytest-cov"]

[project.scripts]
clinicdesk-mcp = "clinicdesk.server:main"

[tool.setuptools]
packages = ["clinicdesk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
